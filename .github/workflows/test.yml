name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} / Env ${{ matrix.environment }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [ghapy310, ghapy311, ghapy312, ghapy313, ghapy314]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.70.0
          environments: ${{ matrix.environment }}
          cache: true

      # Eradiate installs assets as symlinks, which requires Developer Mode on Windows
      - name: Enable Developer Mode (Windows)
        if: runner.os == 'Windows'
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      # Dr.Jit crashes at process exit with the runner's own LLVM; use the
      # version Mitsuba's Windows wheels are built and tested with
      - name: Install LLVM 18.1.8 (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 18.1.8

      - name: Point Dr.Jit to LLVM 18.1.8 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "DRJIT_LIBLLVM_PATH=$env:LLVM_PATH\bin\LLVM-C.dll" >> $env:GITHUB_ENV

      - name: Install Eradiate assets
        run: pixi run -e ${{ matrix.environment }} eradiate data install core mycena

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test
