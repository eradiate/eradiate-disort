name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Env ${{ matrix.environment }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        environment: [ghapy310, ghapy311, ghapy312, ghapy313]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.0
          environments: ${{ matrix.environment }}
          cache: true

      - name: Install Eradiate assets
        run: pixi run -e ${{ matrix.environment }} eradiate data install core mycena

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test
