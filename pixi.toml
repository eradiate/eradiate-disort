[workspace]
name = "eradiate-disort"
version = "0.1.0"
description = "DISORT-based plugin for Eradiate"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64"]

[dependencies]
python = "3.12.*"
cmake = "*"
pixi-pycharm = ">=0.0.11,<0.0.12"

[target.osx-64.pypi-dependencies]
numba = "<0.63"

[pypi-dependencies]
eradiate-disort = { path = ".", editable = true }
nanodisort = { path = "ext/nanodisort", editable = true }
eradiate = { path = "ext/eradiate", editable = true }
xarray = "*"

[activation]
scripts = ["ext/eradiate/setpath.sh"]

[feature.test.pypi-dependencies]
pytest = ">=8.4"
pytest-regressions = ">=2.10"
pytest-benchmark = ">=5.2"

[feature.docs.pypi-dependencies]
autodocsumm = ">=0.2.14"
jupytext = ">=1.16"
myst-nb = ">=1.4"
shibuya = "*"
sphinx = "*"
sphinx-autobuild = ">=2021"
sphinx-copybutton = ">=0.5.2"
sphinx-design = "*"
sphinx-iconify = "*"

[feature.dev.pypi-dependencies]
eradiate = { path = "ext/eradiate", editable = true, extras = ["recommended"] }
seaborn = "*"

[tasks]
bench = { cmd = "pytest tests/benchmarks/ --benchmark-autosave --benchmark-json=benchmarks/results.json -v", cwd = "." }
nb-execute = { cmd = "jupytext --sync --execute tests/notebooks/*.py", cwd = ".", env = { ERADIATE_TEST_MODE = "test" } }
docs = { cmd = "sphinx-build -b html docs docs/_build/html", cwd = "." }
docs-clean = { cmd = "rm -rf docs/_build/", cwd = "." }
docs-serve = { cmd = "sphinx-autobuild docs docs/_build/html", cwd = "." }
docs-lock = { cmd = "uv pip freeze --exclude-editable > docs/requirements.txt", cwd = "." }

[environments]
default = { features = ["test"], solve-group = "default" }
dev = { features = ["test", "docs", "dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
