[project]
name = "eradiate-disort"
version = "0.1.0"
description = "Eradiate DISORT backend"
readme = "README.md"
authors = [{ name = "Vincent Leroy", email = "vincent.leroy@rayference.eu" }]
requires-python = ">=3.10,<3.14"
dependencies = ["nanodisort==0.2.*", "xarray>=2024.11", "eradiate==1.2.0rc5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Physics",
]

[dependency-groups]
# Dev groups
test = [
  "pytest>=8.4",
  "pytest-regressions>=2.10",
  "pytest-benchmark>=5.2",
  "pytest-order>=1.4",
  "seaborn",
]
docs = [
  "autodocsumm>=0.2.14",
  "jupytext>=1.16",
  "myst-nb>=1.4",
  "shibuya",
  "sphinx",
  "sphinx-autobuild>=2021",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design",
  "sphinx-iconify",
  "sphinxcontrib-bibtex",
]
lint = ["ruff", "ty", "reuse"]
dev = [
  "bump-my-version",
  "ipykernel",
  "ipywidgets",
  "jupyterlab",
  "ruff>=0.14.9",
  "uv",
  { include-group = "test" },
  { include-group = "docs" },
]
# CI groups
kernel = [
  "eradiate==1.2.0rc5",
  "eradiate-mitsuba==0.5.0rc2",
] # force PyPI kernel package
rtd = [{ include-group = "kernel" }, { include-group = "docs" }] # Read The Docs
gha = [{ include-group = "kernel" }, { include-group = "test" }] # GH Actions

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Pixi configuration ---

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.target.osx-64.pypi-dependencies]
numba = "<0.63"

[tool.pixi.target.osx-arm64.dependencies]
netcdf4 = "*"

[tool.pixi.pypi-dependencies]
eradiate-disort = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
cmake = "*"
pixi-pycharm = ">=0.0.11,<0.0.12"

[tool.pixi.feature.dev.pypi-dependencies]
nanodisort = { path = "ext/nanodisort", editable = true }
eradiate = { path = "ext/eradiate", editable = true, extras = ["recommended"] }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
# Development environments
default = { features = ["py312", "test", "docs", "dev"], solve-group = "default" }

# CI environments
ghapy310 = { features = ["py310", "kernel", "test"] }
ghapy311 = { features = ["py311", "kernel", "test"] }
ghapy312 = { features = ["py312", "kernel", "test"] }
ghapy313 = { features = ["py313", "kernel", "test"] }

[tool.pixi.feature.test.tasks]
# Wrap pytest with appropriate environment tuning to enforce a non-interactive
# backend and route test mode-dependent features to the 'test' mode
test.cmd = "pytest"
test.cwd = "."
test.env = { MPLBACKEND = "Agg", ERADIATE_TEST_MODE = "test" }

[tool.pixi.feature.dev.activation]
# set-macos-deployment-target.sh pins MACOSX_DEPLOYMENT_TARGET to the interpreter's
# own sysconfig value so locally-built wheel tags match uv's acceptance ceiling
# (avoids scikit-build-core tagging with the running macOS version). No-op off macOS.
scripts = ["scripts/set-macos-deployment-target.sh", "ext/eradiate/setpath.sh"]
env = { ERADIATE_PATH = "$PIXI_PROJECT_ROOT/tests/data" }

[tool.pixi.feature.dev.tasks]
# Mitsuba kernel build tasks (mirrors ext/eradiate pixi tasks; Mitsuba lives at ext/eradiate/ext/mitsuba)
kernel-configure.cmd = """
    cmake -S ext/eradiate/ext/mitsuba \
          -B ext/eradiate/ext/mitsuba/build \
          -DCMAKE_BUILD_TYPE=Release -GNinja --preset eradiate
"""
kernel-configure.cwd = "."

kernel-build.cmd = "cmake --build ext/eradiate/ext/mitsuba/build"
kernel-build.cwd = "."
kernel-build.depends-on = ["kernel-configure"]

kernel-clean = { cmd = "rm -rf ext/eradiate/ext/mitsuba/build/", cwd = "." }

# Run benchmarks
bench.cmd = "pytest tests/benchmarks"
bench.cwd = "."
bench.env = { MPLBACKEND = "Agg", ERADIATE_TEST_MODE = "benchmark" }

# Register the pixi environment as a Jupyter kernel (idempotent)
nb-kernel-register.cmd = """
    python -m ipykernel install --sys-prefix --name eradiate-disort \
                                --display-name 'eradiate-disort (pixi)'
"""
nb-kernel-register.cwd = "."

# Export percent-format notebooks to ipynb, executing them and saving the output
nb-execute.cmd = "jupytext --sync --execute"
nb-execute.cwd = "."
nb-execute.env = { ERADIATE_TEST_MODE = "tutorial" }
nb-execute.depends-on = ["nb-kernel-register"]

nb-execute-all.cmd = "jupytext --sync --execute tests/examples/example_*.py"
nb-execute-all.cwd = "."
nb-execute-all.env = { ERADIATE_TEST_MODE = "tutorial" }
nb-execute-all.depends-on = ["nb-kernel-register"]

# Build documentation
docs = { cmd = "sphinx-build -b html docs docs/_build/html", cwd = "." }
docs-clean = { cmd = "rm -rf docs/_build/", cwd = "." }
docs-serve = { cmd = "sphinx-autobuild docs docs/_build/html", cwd = "." }

# Export locked dependencies for Read The Docs setup
docs-lock.cmd = """
    uv pip compile --upgrade --quiet --no-progress --prerelease=allow \
        --python-version 3.12 --group rtd \
        --output-file docs/requirements.txt pyproject.toml
"""
docs-lock.cwd = "."

# Linting
lint = { cmd = "ruff check", cwd = "." }
lint-ext = { cmd = "ruff check --extend-select B,C4,SIM,PIE,UP,PERF,NPY,RUF", cwd = "." }
lint-reuse = { cmd = "reuse lint", cwd = "." }

# Version bump
bump = { cmd = "bump-my-version bump --new-version $RELEASE_VERSION" }
bump-show = { cmd = "bump-my-version show-bump" }
bump-dry = { cmd = "bump-my-version bump --new-version $RELEASE_VERSION --dry-run --verbose" }

# --- Tool configuration ---

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
exclude = ["tests/examples/example_*.py", "docs/examples/*.ipynb"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "--ignore=tests/benchmarks --tb=short -v -p no:benchmark"
