[project]
name = "eradiate-disort"
version = "0.1.0"
description = "Eradiate DISORT backend"
readme = "README.md"
authors = [{ name = "Vincent Leroy", email = "vincent.leroy@rayference.eu" }]
requires-python = ">=3.9,<3.14"
dependencies = ["nanodisort==0.2.*", "xarray", "eradiate"]

[dependency-groups]
test = [
  "pytest>=8.4",
  "pytest-regressions>=2.10",
  "pytest-benchmark>=5.2",
  "pytest-order>=1.4",
]
docs = [
  "autodocsumm>=0.2.14",
  "jupytext>=1.16",
  "myst-nb>=1.4",
  "shibuya",
  "sphinx",
  "sphinx-autobuild>=2021",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design",
  "sphinx-iconify",
]
lint = ["ruff", "ty"]
dev = [
  "ipykernel",
  "ipywidgets",
  "jupyterlab",
  "ruff>=0.14.9",
  "seaborn",
  "uv",
  { include-group = "test" },
  { include-group = "docs" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Pixi configuration ---

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
cmake = "*"
pixi-pycharm = ">=0.0.11,<0.0.12"

[tool.pixi.target.osx-64.pypi-dependencies]
numba = "<0.63"

[tool.pixi.target.osx-arm64.dependencies]
netcdf4 = "*"

[tool.pixi.pypi-dependencies]
eradiate-disort = { path = ".", editable = true }
nanodisort = { path = "ext/nanodisort", editable = true }
eradiate = { path = "ext/eradiate", editable = true }

[tool.pixi.activation]
# set-macos-deployment-target.sh pins MACOSX_DEPLOYMENT_TARGET to the interpreter's
# own sysconfig value so locally-built wheel tags match uv's acceptance ceiling
# (avoids scikit-build-core tagging with the running macOS version). No-op off macOS.
scripts = ["scripts/set-macos-deployment-target.sh", "ext/eradiate/setpath.sh"]
env = { ERADIATE_PATH = "$PIXI_PROJECT_ROOT/tests/data" }

[tool.pixi.feature.dev.pypi-dependencies]
eradiate = { path = "ext/eradiate", editable = true, extras = ["recommended"] }

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }
dev = { features = ["test", "docs", "dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tool.pixi.tasks]
# Mitsuba kernel build tasks (mirrors ext/eradiate pixi tasks; Mitsuba lives at ext/eradiate/ext/mitsuba)
kernel-configure.cmd = """
    cmake -S ext/eradiate/ext/mitsuba \
          -B ext/eradiate/ext/mitsuba/build \
          -DCMAKE_BUILD_TYPE=Release -GNinja --preset eradiate
"""
kernel-configure.cwd = "."

kernel-build.cmd = "cmake --build ext/eradiate/ext/mitsuba/build"
kernel-build.cwd = "."
kernel-build.depends-on = ["kernel-configure"]

kernel-clean = { cmd = "rm -rf ext/eradiate/ext/mitsuba/build/", cwd = "." }

# Wrap pytest with appropriate environment tuning to enforce a non-interactive
# backend and route test mode-dependent features to the 'test' mode
test = { cmd = "pytest", cwd = ".", env = { MPLBACKEND = "Agg", ERADIATE_TEST_MODE = "test" } }

# Run benchmarks
bench.cmd = """
    pytest tests/benchmarks/ --benchmark-autosave \
                             --benchmark-json=benchmarks/results.json -v
"""
bench.cwd = "."
bench.env = { MPLBACKEND = "Agg", ERADIATE_TEST_MODE = "benchmark" }

# Register the pixi environment as a Jupyter kernel (idempotent)
nb-kernel-register.cmd = """
    python -m ipykernel install --sys-prefix --name eradiate-disort \
                                --display-name 'eradiate-disort (pixi)'
"""
nb-kernel-register.cwd = "."

# Export percent-format notebooks to ipynb, executing them and saving the output
nb-execute.cmd = "jupytext --sync --execute"
nb-execute.cwd = "."
nb-execute.env = { ERADIATE_TEST_MODE = "tutorial" }
nb-execute.depends-on = ["nb-kernel-register"]

nb-execute-all.cmd = "jupytext --sync --execute tests/examples/example_*.py"
nb-execute-all.cwd = "."
nb-execute-all.env = { ERADIATE_TEST_MODE = "tutorial" }
nb-execute-all.depends-on = ["nb-kernel-register"]

# Build documentation
docs = { cmd = "sphinx-build -b html docs docs/_build/html", cwd = "." }
docs-clean = { cmd = "rm -rf docs/_build/", cwd = "." }
docs-serve = { cmd = "sphinx-autobuild docs docs/_build/html", cwd = "." }

# Export locked dependencies for Read The Docs setup
docs-lock.cmd = """
    uv pip compile --upgrade --quiet --no-progress \
        --python-version 3.12 --group docs \
        --output-file docs/requirements.txt pyproject.toml
"""
docs-lock.cwd = "."

# Linting
lint = { cmd = "ruff check", cwd = "." }
lint-ext = { cmd = "ruff check --extend-select B,C4,SIM,PIE,UP,PERF,NPY,RUF", cwd = "." }

# --- Tool configuration ---

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "--ignore=tests/benchmarks --tb=short -v"
