[project]
name = "eradiate-disort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "Vincent Leroy", email = "vincent.leroy@rayference.eu" }
]
requires-python = ">=3.9,<3.13"
dependencies = ["nanodisort", "xarray", "eradiate[kernel]==1.0.*", "networkx"]

[project.optional-dependencies]
visualization = ["pydot"]

[dependency-groups]
test = [
  "pytest",
]
dev = [
  "ipykernel",
  "ipywidgets",
  "jupyterlab",
  "ruff>=0.14.9",
  "pydot",
  { include-group = "test" },
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.sources]
nanodisort = { path = "ext/nanodisort", editable = true }
