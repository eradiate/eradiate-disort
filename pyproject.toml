[project]
name = "eradiate-disort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Vincent Leroy", email = "vincent.leroy@rayference.eu" }]
requires-python = ">=3.9,<3.14"
dependencies = ["nanodisort>=0.1.0,<0.2.0", "xarray", "eradiate"]

[dependency-groups]
test = ["pytest>=8.4"]
docs = [
  "autodocsumm>=0.2.14",
  "shibuya",
  "sphinx",
  "sphinx-autobuild>=2021",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design",
  "sphinx-iconify",
]
lint = ["ruff", "ty"]
dev = [
  "ipykernel",
  "ipywidgets",
  "jupyterlab",
  "ruff>=0.14.9",
  "uv",
  { include-group = "test" },
  { include-group = "docs" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
